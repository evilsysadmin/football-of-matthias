name: Football · XI match endurance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Preserve each main SHA's deterministic XI match telemetry independently.
  # Only superseded revisions of the same PR may be cancelled.
  group: football-xi-endurance-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xi-endurance:
    name: XI · 60s live match and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_RELEASE: '4.7.2-stable'
      GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: chess-football-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}
      - name: Install pinned editor when cache misses
        shell: bash
        run: |
          set -euo pipefail
          directory="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$directory/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$directory"
            archive="$RUNNER_TEMP/football-godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$directory"
            mv "$directory/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Materialize approved canonical assets
        run: python3 scripts/materialize_canonical.py
      - name: Import Godot project and register script class names
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-import.log"
          "$godot" --headless --path games/chess-football-godot --editor --quit 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI project import failed.'
            exit 1
          fi
      # Fail fast on seeded input/replay drift before expensive cinematic
      # scouts. All existing XI physics, pass, E and visual gates still run
      # unchanged after this self-contained QA-only fixture.
      - name: Autoplay XI · real input bot, pressure and handoff telemetry
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-autoplay.log"
          set +e
          timeout 140s "$godot" --headless --quit-after 16000 --path games/chess-football-godot --script res://tests/eleven_autoplay_player_bot.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Real-input XI autoplay bot failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_AUTOPLAY_OK' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-autoplay.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text().splitlines()
          prefix = 'FOOTBALL_XI_AUTOPLAY_METRICS '
          reports = [json.loads(x.removeprefix(prefix)) for x in lines if x.startswith(prefix)]
          assert len(reports) == 1, 'Expected one real-input autoplay report'
          report = reports[0]
          assert report['kind'] == 'seeded_24s_real_godot_input_bot_not_live_players'
          audit = report['replay_audit']
          assert audit['checked'] is True
          assert audit['seed'] == 65113 and audit['fields_compared'] >= 12
          assert audit['checkpoints_compared'] == 24
          assert audit['identical'] is True and audit['mismatched_fields'] == [], (
              'Real seeded XI replay must be exactly identical, not just self-consistent'
          )
          assert audit['max_ball_drift'] == 0 and audit['first_ball_drift_tick'] == -1
          assert audit['first_state_divergence_tick'] == -1
          assert audit['first_ball_drift_tick'] == -1 or (
              0 <= audit['first_ball_drift_tick'] < report['ticks_per_trial'])
          assert audit['first_state_divergence_tick'] == -1 or (
              0 <= audit['first_state_divergence_tick'] < report['ticks_per_trial'])
          assert audit['max_ball_drift'] >= 0
          assert all(field in audit['mismatched_fields'] for field in [
              'physics_checkpoints'
          ]) if audit['max_ball_drift'] >= 1.0 else True
          assert [x['difficulty'] for x in report['cases']] == ['normal', 'hard']
          assert all(x['ticks'] == report['ticks_per_trial'] for x in report['cases'])
          assert sum(x['automatic_reassignments'] for x in report['cases']) == report['observed_automatic_reassignments']
          for case in report['cases']:
              causes = case['control_change_causes']
              events = case['control_change_timeline']
              assert len(events) == case['control_change_frames']
              assert sum(causes.values()) == case['control_change_frames']
              assert causes['auto_defense'] == case['automatic_reassignments']
              assert causes['manual_q'] == case['manual_q_effective']
              assert case['actual_human_travel_units'] > 160.0, (
                  'Human input must move a real XI player through physics'
              )
              assert case['human_possession_frames'] >= 50
              assert case['cpu_possession_frames'] >= 50
              assert case['tackles_launched'] >= 1
              assert case['uncommanded_stable_cpu_switches'] == 0
              gaps = case['pressure_gap_episodes']
              assert sum(g['frames'] for g in gaps) == case['strict_gap_frames_240']
              assert case['strict_gap_frames_240'] <= case['defensive_samples']
              assert max((g['frames'] for g in gaps), default=0) == case['max_pressure_gap_frames']
              assert all(g['start_tick'] < g['end_tick'] <= case['ticks']
                         and g['end_tick']-g['start_tick'] == g['frames']
                         and g['max_distance'] >= 240
                         and g['ended_by'] in (
                             'closed_to_240', 'possession_changed', 'restart', 'simulation_end'
                         ) for g in gaps)
              assert causes['uncommanded_stable_cpu'] == 0
              assert all(e['cause'] in causes and
                         0 <= e['from'] < 11 and 0 <= e['to'] < 11 and
                         e['from'] != e['to'] for e in events)
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print('FOOTBALL_XI_AUTOPLAY_ARTIFACT_OK cases=2')
          PY
      - name: Upload XI real-input autoplay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-autoplay
          path: ${{ runner.temp }}/football-xi-autoplay.json
          retention-days: 7
          if-no-files-found: warn

      - name: Test E cut after extended possession (no oracle tackle)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-mid-possession-regate.log"
          set +e
          timeout 35s "$godot" --headless --quit-after 3000 --path games/chess-football-godot --script res://tests/xi_mid_possession_dribble_read_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            exit 1
          fi
          grep -q 'FOOTBALL_XI_MID_POSSESSION_DRIBBLE_READ_OK' "$log"

      - name: Run real 22-player simulation at 60 Hz
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-endurance.log"
          set +e
          timeout 110s "$godot" --headless --quit-after 12000 --path games/chess-football-godot --script res://tests/eleven_match_endurance_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI match physics or real restart recovery failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_ENDURANCE_60S_OK' "$log"

      - name: Measure seeded XI passing and possession pace by difficulty
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-pass-pace.log"
          set +e
          timeout 110s "$godot" --headless --quit-after 12000 --path games/chess-football-godot --script res://tests/eleven_pass_pace_metrics.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI passing metrics simulation failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_PASS_PACE_METRICS_OK' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-pass-pace.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text().splitlines()
          prefix = 'FOOTBALL_XI_PASS_PACE_METRICS '
          reports = [json.loads(line.removeprefix(prefix)) for line in lines
                     if line.startswith(prefix)]
          assert len(reports) == 1, 'Expected one real XI metrics report'
          report = reports[0]
          assert [x['difficulty'] for x in report['levels']] == [
              'easy', 'normal', 'hard', 'expert'
          ]
          assert report['kind'] == 'seeded_godot_xi_20s_per_level_not_live_match_telemetry'
          assert sum(x['attempts'] for x in report['levels']) == report['observed_attempts']
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print('FOOTBALL_XI_PASS_PACE_ARTIFACT_OK trials=4')
          PY
      - name: Upload seeded XI pass pace baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-pass-pace
          path: ${{ runner.temp }}/football-xi-pass-pace.json
          retention-days: 7
          if-no-files-found: warn

      # Complementary attacking real-input trial. Unlike the existing
      # defensive handoff bot it starts with human XI possession, issues
      # actual E keys, and observes full 22-player AI/tackle/ball outcomes.
      - name: Autoplay XI · real input attacking E during open play
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-attacking-e.log"
          set +e
          timeout 420s "$godot" --headless --quit-after 36000 --path games/chess-football-godot --script res://tests/xi_attacking_regate_input_bot.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI real-input attacking E simulation failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_ATTACK_REGATE_INPUT_OK' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-attacking-e.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          prefix = 'FOOTBALL_XI_ATTACK_REGATE_INPUT '
          reports = [json.loads(line[len(prefix):])
                     for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.startswith(prefix)]
          assert len(reports) == 1, 'Expected one whole-XI attacking bot report'
          report = reports[0]
          assert report['kind'] == 'seeded_paired_real_input_xi_open_play_12s_not_full_matches'
          assert (report['frames_per_trial'] == 720
                  and report['result_after_frames'] == 48
                  and report['followthrough_after_frames'] == 72)
          expected = [
              ('normal', 'cut', 'late'), ('normal', 'cut', 'early'),
              ('normal', 'feint', 'late'), ('normal', 'feint', 'early'),
              ('hard', 'cut', 'late'), ('hard', 'cut', 'early'),
              ('hard', 'feint', 'late'), ('hard', 'feint', 'early'),
              ('normal', 'cut', 'middle'), ('normal', 'feint', 'middle'),
              ('hard', 'cut', 'middle'), ('hard', 'feint', 'middle'),
          ]
          assert [(x['difficulty'], x['opening'], x['approach'])
                  for x in report['cases'][::2]] == expected
          assert [(x['difficulty'], x['opening'], x['approach'])
                  for x in report['cases'][1::2]] == expected
          assert [x['variant'] for x in report['cases']] == [
              variant for _ in expected for variant in ('e', 'run_without_e')
          ]
          assert len(report['pairs']) == 12
          assert [(p['difficulty'], p['opening'], p['approach'])
                  for p in report['pairs']] == expected
          audit = report['replay_audit']
          assert len(audit) == 2
          assert [(a['seed'], a['variant'], a['difficulty'],
                   a['opening'], a['approach']) for a in audit] == [
              (67119, 'e', 'hard', 'cut', 'early'),
              (67119, 'run_without_e', 'hard', 'cut', 'early'),
          ]
          assert all(a['identical'] == (not a['mismatched_fields'])
                     and a['opening_forward_drift'] >= 0
                     and (a['first_loss_frame'] == -1 or
                          0 <= a['first_loss_frame'] < 48)
                     and (a['repeat_loss_frame'] == -1 or
                          0 <= a['repeat_loss_frame'] < 48)
                     for a in audit)
          outcomes = ('retained', 'loose', 'cpu_stolen', 'teammate', 'restart')
          # The first Hard/feint/late win needs its own E and no-E replay,
          # not merely the legacy Hard/cut/early drift audit.
          earned = report['earned_e_replay_audit']
          assert [(a['seed'], a['variant'], a['difficulty'],
                   a['opening'], a['approach']) for a in earned] == [
              (67123, 'e', 'hard', 'feint', 'late'),
              (67123, 'run_without_e', 'hard', 'feint', 'late'),
          ]
          assert all(
              a['original_outcome_1_2s'] in outcomes
              and a['repeated_outcome_1_2s'] in outcomes
              and a['retention_reproducible'] == (
                  (a['original_outcome_1_2s'] == 'retained') ==
                  (a['repeated_outcome_1_2s'] == 'retained')
              )
              and -1 <= a['original_first_loss_1_2s'] < 72
              and -1 <= a['repeated_first_loss_1_2s'] < 72
              and a['first_cpu_tackles'] >= 0 and a['repeat_cpu_tackles'] >= 0
              for a in earned
          )
          assert all(
              p['e_outcome'] in outcomes and p['run_outcome'] in outcomes
              and p['e_outcome_1_2s'] in outcomes and p['run_outcome_1_2s'] in outcomes
              and -1 <= p['e_first_loss_frame'] < 48
              and -1 <= p['run_first_loss_frame'] < 48
              and -1 <= p['e_first_loss_1_2s'] < 72
              and -1 <= p['run_first_loss_1_2s'] < 72
              for p in report['pairs']
          )
          assert all(x['staged_rival_distance'] == {
              'late': 148.0, 'middle': 185.0, 'early': 225.0
          }[x['approach']] for x in report['cases'])
          assert report['e_events'] == sum(x['e_executed'] for x in report['cases'])
          assert all(
              x['e_pressed'] == x['e_executed']
              and ((x['e_executed'] >= 1 and x['pressured_e'] >= 1)
                   if x['variant'] == 'e'
                   else (x['e_executed'] == 0 and x['pressured_e'] == 0))
              and len(x['events']) == x['e_executed']
              and sum(x['possession_frames'].values()) == x['ticks'] == 720
              and x['opening_outcome'] in ('retained', 'loose', 'cpu_stolen', 'teammate', 'restart')
              and x['followthrough_outcome'] in ('retained', 'loose', 'cpu_stolen', 'teammate', 'restart')
              and -1 <= x['followthrough_first_loss_frame'] < 72
              for x in report['cases']
          )
          assert sum(report['outcomes'].values()) == report['e_events']
          assert all(e['outcome_at_0_8s'] in report['outcomes']
                     and e['mode'] in ('cut', 'feint')
                     and e['nearest_rival_at_e'] > 0
                     for case in report['cases'] for e in case['events'])
          first_losses = [e['first_loss'] for case in report['cases']
                          for e in case['events'] if e['lost_possession_at_any_point']]
          assert first_losses, 'This pressure fixture must observe physical possession losses'
          for loss in first_losses:
              tacklers = loss['active_tacklers']
              assert len(tacklers) == loss['active_cpu_tackles']
              assert all(
                  isinstance(t['index'], int) and 0 <= t['index'] < 11
                  and t['assignment'] in ('primary', 'cover', 'other')
                  and t['distance_to_ball'] >= 0
                  and isinstance(t['clean_ball_hitbox'], bool)
                  for t in tacklers
              )
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          # A report of 12 outcomes is not a claim of a 12-game win rate.
          # Surface observed control pairs and the independent earned-E
          # replay, so a single lucky result is not mistaken for progress.
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              pairs = report['pairs']
              earned = report['earned_e_replay_audit']
              e_08 = sum(p['e_outcome'] == 'retained' for p in pairs)
              no_e_08 = sum(p['run_outcome'] == 'retained' for p in pairs)
              e_12 = sum(p['e_outcome_1_2s'] == 'retained' for p in pairs)
              no_e_12 = sum(p['run_outcome_1_2s'] == 'retained' for p in pairs)
              earned_pairs = sum(
                  p['e_outcome_1_2s'] == 'retained'
                  and p['run_outcome_1_2s'] != 'retained'
                  for p in pairs
              )
              repeat_earned = (
                  earned[0]['original_outcome_1_2s'] == 'retained'
                  and earned[0]['repeated_outcome_1_2s'] == 'retained'
                  and earned[1]['original_outcome_1_2s'] != 'retained'
                  and earned[1]['repeated_outcome_1_2s'] != 'retained'
              )
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write(
                      '### XI regate E · 22 jugadores / pares reales a 60 Hz\n'
                      f'- Posesión del portador a 0,8 s: E **{e_08}/12**, '
                      f'correr sin E **{no_e_08}/12**\n'
                      f'- Posesión del portador a 1,2 s: E **{e_12}/12**, '
                      f'correr sin E **{no_e_12}/12**\n'
                      f'- Pares donde E retiene y control no: **{earned_pairs}/12**\n'
                      f'- Hard/feint/late, resultado E original/replay: '
                      f'**{earned[0]["original_outcome_1_2s"]} / '
                      f'{earned[0]["repeated_outcome_1_2s"]}**\n'
                      f'- Hard/feint/late, resultado control original/replay: '
                      f'**{earned[1]["original_outcome_1_2s"]} / '
                      f'{earned[1]["repeated_outcome_1_2s"]}**\n'
                      f'- Victoria reproducida del caso auditado: '
                      f'**{"sí" if repeat_earned else "no"}**\n\n'
                      '_Son 12 escenarios controlados, no una tasa de éxito '
                      'de jugadores reales. Consultar JSON para pérdidas '
                      'por fotograma y divergencias de replay.\n'
                  )
          print('FOOTBALL_XI_ATTACK_REGATE_ARTIFACT_OK cases=24 pairs=12 seeded_replays=4 real_input=1 early_middle_late=1')
          PY
      - name: Upload XI open-play attacking E bot telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-attacking-regates
          path: ${{ runner.temp }}/football-xi-attacking-e.json
          retention-days: 7
          if-no-files-found: warn

      # Skill-specific diagnostic: the 12-pair pressure bot always E's at
      # tick zero; this separate, bounded matrix probes human E timing.
      # Keep it independent of difficulty tuning and all gameplay gates.
      - name: Scout XI · E timing before, during and after real Hard pressure
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-e-timing.log"
          set +e
          timeout 170s "$godot" --headless --quit-after 16000 --path games/chess-football-godot --script res://tests/xi_e_skill_timing_scout.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI E timing scout failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_E_TIMING_SCOUT_OK fixtures=24 arms=48' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-e-timing.json" <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          prefix = 'FOOTBALL_XI_E_TIMING_SCOUT '
          reports = [json.loads(line[len(prefix):])
                     for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.startswith(prefix)]
          assert len(reports) == 1, 'Expected one physical E timing sweep'
          report = reports[0]
          assert report['fixtures'] == 24 and report['arms'] == 48
          assert report['sampled_trigger_frames'] == [0, 8, 16]
          assert report['distances'] == [148.0, 185.0]
          assert report['followthrough_frames'] == 72
          rows = report['rows']
          assert len(rows) == 48
          outcomes = ('retained', 'loose', 'cpu_stolen', 'teammate', 'restart')
          actual_e = 0
          paired_wins = []
          delayed_losses = []
          trigger_drifts = []
          matched_at_trigger = 0
          for i in range(0, len(rows), 2):
              e, control = rows[i:i+2]
              assert e['variant'] == 'e' and control['variant'] == 'run_without_e'
              assert e['seed'] == control['seed']
              assert e['action'] == control['action']
              assert e['side'] == control['side']
              assert e['distance'] == control['distance']
              assert e['trigger_frame'] == control['trigger_frame']
              assert e['action'] in ('cut', 'feint')
              assert e['side'] in ('upper', 'lower')
              assert e['outcome_1_2s_after_trigger'] in outcomes
              assert control['outcome_1_2s_after_trigger'] in outcomes
              assert not control['e_executed']
              assert -1 <= e['first_loss_after_trigger'] < 72
              assert -1 <= control['first_loss_after_trigger'] < 72
              assert e['cpu_tackle_attempts'] >= 0
              assert control['cpu_tackle_attempts'] >= 0
              assert abs(e['rival_distance_at_start'] -
                         control['rival_distance_at_start']) < 0.1
              drift = abs(e['rival_distance_at_trigger'] -
                          control['rival_distance_at_trigger'])
              trigger_drifts.append(round(drift, 1))
              matched_at_trigger += int(drift < 1.0)
              actual_e += int(e['e_executed'])
              # Do not count an E-only victory as counterfactual proof
              # if the supposedly matched pair already drifted in the
              # whole XI simulation before E was pressed.
              # A carrier who lost the ball and happened to reclaim it
              # at the sample frame did NOT retain possession uninterrupted.
              e_kept = (e['outcome_1_2s_after_trigger'] == 'retained'
                        and e['first_loss_after_trigger'] == -1)
              control_kept = (
                  control['outcome_1_2s_after_trigger'] == 'retained'
                  and control['first_loss_after_trigger'] == -1
              )
              if drift < 1.0 and e['e_executed'] and e_kept and not control_kept:
                  paired_wins.append({
                      'action': e['action'], 'side': e['side'],
                      'distance': e['distance'], 'trigger': e['trigger_frame']
                  })
              if (drift < 1.0 and e['e_executed'] and
                      e['first_loss_after_trigger'] >= 0 and
                      control['first_loss_after_trigger'] >= 0):
                  delay = (e['first_loss_after_trigger'] -
                           control['first_loss_after_trigger'])
                  if delay >= 6:
                      delayed_losses.append({
                          'action': e['action'], 'side': e['side'],
                          'distance': e['distance'], 'trigger': e['trigger_frame'],
                          'first_loss_delayed_frames': delay,
                      })
          assert actual_e >= 12, 'E sweep must actually exercise pressured E'
          assert sum(x['cpu_tackle_attempts'] for x in rows) > 0
          report['accepted_e_inputs'] = actual_e
          report['trigger_pair_drift_units'] = trigger_drifts
          report['matched_at_trigger_under_1_unit'] = matched_at_trigger
          report['physically_earned_pairs'] = paired_wins
          report['meaningful_first_loss_delays'] = delayed_losses
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              paired = len(paired_wins)
              kept = sum(x['outcome_1_2s_after_trigger'] == 'retained'
                         and x['first_loss_after_trigger'] == -1
                         for x in rows[::2])
              controls = sum(x['outcome_1_2s_after_trigger'] == 'retained'
                             and x['first_loss_after_trigger'] == -1
                             for x in rows[1::2])
              recovered_after_loss = sum(
                  x['outcome_1_2s_after_trigger'] == 'retained'
                  and x['first_loss_after_trigger'] >= 0 for x in rows
              )
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write(
                      '### XI E · Timing de entrada / 22 futbolistas\n'
                      f'- E ejecutados físicamente: **{actual_e}/24**\n'
                      f'- Pares todavía equivalentes al pulsar E (<1 unidad): '
                      f'**{matched_at_trigger}/24**; máxima deriva '
                      f'**{max(trigger_drifts):.1f} unidades**\n'
                      f'- Posesiones E intactas 1,2s tras trigger: **{kept}/24**\n'
                      f'- Posesiones control sin E intactas: **{controls}/24**\n'
                      f'- Balones perdidos y recuperados antes del muestreo: '
                      f'**{recovered_after_loss}** (NO son retenciones)\n'
                      f'- E retrasa la primera pérdida >=6 frames en pares '
                      f'comparables: **{len(delayed_losses)}**\n'
                      f'- Parejas comparables donde E mejora control: **{paired}/24**\n'
                      '- Escenarios Hard: t=0,8,16 frames, distancias 148/185, '
                      'ambas bandas, cut y feint; no son tasas de éxito humano.\n'
                  )
          print('FOOTBALL_XI_E_TIMING_ARTIFACT_OK arms=48 fixtures=24 '
                f'accepted_e={actual_e} paired_wins={len(paired_wins)} '
                f'delayed_losses={len(delayed_losses)}')
          PY
      - name: Upload XI E timing scout measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-e-timing-scout
          path: ${{ runner.temp }}/football-xi-e-timing.json
          retention-days: 7
          if-no-files-found: warn

      # Paired real-input E→Space experiment. A successful pass requires
      # a real release and first physical touch by the intended XI teammate.
      # Neither E timing nor defending gameplay is modified by this scout.
      # Real XI keyboard-regression guard, including rejected E during Space,
      # accepted E taking priority, the visible receiver, and untouched 5v5.
      - name: XI · E and charged Space input ownership + real pass receiver cue
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-e-pass-keys.log"
          set +e
          timeout 70s "$godot" --headless --quit-after 3000 --path games/chess-football-godot --script res://tests/xi_e_pass_charging_input_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI E→Space input and recipient cue regression failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_E_PASS_CHARGE_INPUT_OK rejected_e_keeps_space=true real_release=true accepted_e_cancels=true live_target=true free_lane=true legacy_5v5=true' "$log"

      - name: Scout XI · real E into charged Space pass and physical first touch
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-e-pass.log"
          set +e
          timeout 195s "$godot" --headless --quit-after 18000 --path games/chess-football-godot --script res://tests/xi_e_pass_exit_scout.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI real E→Space first-touch scout failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_E_PASS_SCOUT_OK pairs=24 arms=48 real_space=true' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-e-pass.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          prefix = 'FOOTBALL_XI_E_PASS_SCOUT '
          reports = [json.loads(line[len(prefix):])
                     for line in Path(sys.argv[1]).read_text().splitlines()
                     if line.startswith(prefix)]
          assert len(reports) == 1, 'Expected exactly one 22-player pass scout'
          report = reports[0]
          assert report['kind'] == (
              'paired_real_xi_22_player_e_or_run_then_actual_space_pass_not_human_win_rate'
          )
          assert report['arms'] == 48 and report['pairs'] == 24
          assert report['pass_start_frames'] == [8, 14, 20]
          assert report['charge_frames'] == 7 and report['simulation_frames'] == 170
          rows = report['rows']
          assert len(rows) == 48
          earned = []
          e_success = 0
          run_success = 0
          for i in range(0, len(rows), 2):
              e, control = rows[i:i+2]
              assert e['variant'] == 'e'
              assert control['variant'] == 'run_without_e'
              assert e['e_executed'] and not control['e_executed']
              assert e['seed'] == control['seed']
              assert e['mode'] == control['mode']
              assert e['side'] == control['side']
              assert e['distance'] == control['distance']
              assert e['pass_start_frame'] == control['pass_start_frame']
              assert abs(e['start_rival_distance'] -
                         control['start_rival_distance']) < 0.1
              assert e['mode'] in ('feint', 'cut')
              assert e['side'] in ('upper', 'lower')
              for x in (e, control):
                  assert x['pass_start_frame'] in (8, 14, 20)
                  assert x['first_touch_team'] in (-1, 0, 1)
                  assert x['cpu_tackles'] >= 0
                  assert x['clean_intended_pass'] == (
                      x['pass_released'] and x['first_loss_before_pass'] == -1
                      and x['first_touch_team'] == 0
                      and x['first_touch_index'] == x['intended_receiver_index']
                      and not x['had_restart']
                  )
                  if x['pass_released']:
                      assert x['pass_charge_started']
                      assert x['pass_release_frame'] == (
                          x['pass_start_frame'] + report['charge_frames']
                      )
                      assert x['released_power'] > 0
                  else:
                      assert x['pass_release_frame'] == -1
                      assert x['released_power'] == 0
              e_success += int(e['clean_intended_pass'])
              run_success += int(control['clean_intended_pass'])
              if e['clean_intended_pass'] and not control['clean_intended_pass']:
                  earned.append({
                      'mode': e['mode'], 'side': e['side'],
                      'distance': e['distance'],
                      'pass_start_frame': e['pass_start_frame']
                  })
          report['clean_e_to_pass'] = e_success
          report['clean_running_to_pass'] = run_success
          report['e_only_clean_pass_pairs'] = earned
          candidate = report['candidate_original']
          assert candidate['e']['mode'] == 'feint'
          assert candidate['e']['side'] == 'upper'
          assert candidate['e']['distance'] == 148.0
          assert candidate['e']['pass_start_frame'] == 20
          assert candidate['e']['seed'] == 69219
          assert candidate['run_without_e']['variant'] == 'run_without_e'
          repeats = report['candidate_replays']
          assert len(repeats) == 2
          replay_e_wins = 0
          replay_pairs_match = 0
          for number, trial in enumerate(repeats, start=1):
              assert trial['iteration'] == number
              e = trial['e']
              control = trial['run_without_e']
              assert e['e_executed'] and not control['e_executed']
              assert abs(e['start_rival_distance'] -
                         control['start_rival_distance']) < 0.1
              assert (e['mode'], e['distance'], e['side'],
                      e['pass_start_frame'], e['seed']) == (
                          'feint', 148.0, 'upper', 20, 69219
                      )
              replay_e_wins += int(e['clean_intended_pass'] and
                                   not control['clean_intended_pass'])
              replay_pairs_match += int(
                  e['clean_intended_pass'] == candidate['e']['clean_intended_pass']
                  and control['clean_intended_pass'] ==
                      candidate['run_without_e']['clean_intended_pass']
              )
          report['replayed_e_only_wins'] = replay_e_wins
          report['replications_matching_original_outcomes'] = replay_pairs_match
          report['repeated_candidate_earned'] = (
              candidate['e']['clean_intended_pass']
              and not candidate['run_without_e']['clean_intended_pass']
              and replay_e_wins == 2
          )
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write(
                      '### XI E → pase real / 22 jugadores\n'
                      f'- Pases al receptor previsto sin robo previo: '
                      f'E **{e_success}/24**, correr **{run_success}/24**\n'
                      f'- Parejas exclusivas de E: **{len(earned)}/24**\n'
                      f'- Repetición del primer pase exclusivo de E: **'
                      f'{replay_e_wins}/2** pares reproducidos; '
                      f'**{"sí" if report["repeated_candidate_earned"] else "no"}** '
                      'es una ventaja confirmada en este caso\n'
                      '- 48 brazos base más 4 de replay independiente, '
                      'Space cargado 7 frames y '
                      'primer contacto físico, no una tasa de juego real.\n'
                  )
          print('FOOTBALL_XI_E_PASS_ARTIFACT_OK arms=48 pairs=24 '
                f'e={e_success} no_e={run_success} e_only={len(earned)}')
          PY
      - name: Upload real XI E-to-pass outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-e-pass-scout
          path: ${{ runner.temp }}/football-xi-e-pass.json
          retention-days: 7
          if-no-files-found: warn

