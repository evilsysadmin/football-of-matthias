name: Football · XI match endurance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: football-xi-endurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xi-endurance:
    name: XI · 60s live match and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_RELEASE: '4.7.2-stable'
      GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: chess-football-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}
      - name: Install pinned editor when cache misses
        shell: bash
        run: |
          set -euo pipefail
          directory="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$directory/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$directory"
            archive="$RUNNER_TEMP/football-godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$directory"
            mv "$directory/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - name: Materialize approved canonical assets
        run: python3 scripts/materialize_canonical.py
      - name: Import Godot project and register script class names
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-import.log"
          "$godot" --headless --path games/chess-football-godot --editor --quit 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI project import failed.'
            exit 1
          fi
      - name: Run real 22-player simulation at 60 Hz
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-endurance.log"
          set +e
          timeout 110s "$godot" --headless --quit-after 12000 --path games/chess-football-godot --script res://tests/eleven_match_endurance_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI match physics or real restart recovery failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_ENDURANCE_60S_OK' "$log"

      - name: Measure seeded XI passing and possession pace by difficulty
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-pass-pace.log"
          set +e
          timeout 110s "$godot" --headless --quit-after 12000 --path games/chess-football-godot --script res://tests/eleven_pass_pace_metrics.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI passing metrics simulation failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_PASS_PACE_METRICS_OK' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-pass-pace.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text().splitlines()
          prefix = 'FOOTBALL_XI_PASS_PACE_METRICS '
          reports = [json.loads(line.removeprefix(prefix)) for line in lines
                     if line.startswith(prefix)]
          assert len(reports) == 1, 'Expected one real XI metrics report'
          report = reports[0]
          assert [x['difficulty'] for x in report['levels']] == [
              'easy', 'normal', 'hard', 'expert'
          ]
          assert report['kind'] == 'seeded_godot_xi_20s_per_level_not_live_match_telemetry'
          assert sum(x['attempts'] for x in report['levels']) == report['observed_attempts']
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print('FOOTBALL_XI_PASS_PACE_ARTIFACT_OK trials=4')
          PY
      - name: Upload seeded XI pass pace baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-pass-pace
          path: ${{ runner.temp }}/football-xi-pass-pace.json
          retention-days: 7
          if-no-files-found: warn

      - name: Autoplay XI · real input bot, pressure and handoff telemetry
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-autoplay.log"
          set +e
          timeout 140s "$godot" --headless --quit-after 16000 --path games/chess-football-godot --script res://tests/eleven_autoplay_player_bot.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Real-input XI autoplay bot failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_AUTOPLAY_OK' "$log"
          python3 - "$log" "$RUNNER_TEMP/football-xi-autoplay.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text().splitlines()
          prefix = 'FOOTBALL_XI_AUTOPLAY_METRICS '
          reports = [json.loads(x.removeprefix(prefix)) for x in lines if x.startswith(prefix)]
          assert len(reports) == 1, 'Expected one real-input autoplay report'
          report = reports[0]
          assert report['kind'] == 'seeded_24s_real_godot_input_bot_not_live_players'
          assert [x['difficulty'] for x in report['cases']] == ['normal', 'hard']
          assert all(x['ticks'] == report['ticks_per_trial'] for x in report['cases'])
          assert sum(x['automatic_reassignments'] for x in report['cases']) == report['observed_automatic_reassignments']
          for case in report['cases']:
              causes = case['control_change_causes']
              events = case['control_change_timeline']
              assert len(events) == case['control_change_frames']
              assert sum(causes.values()) == case['control_change_frames']
              assert causes['auto_defense'] == case['automatic_reassignments']
              assert causes['manual_q'] == case['manual_q_effective']
              assert case['uncommanded_stable_cpu_switches'] == 0
              gaps = case['pressure_gap_episodes']
              assert sum(g['frames'] for g in gaps) == case['strict_gap_frames_240']
              assert case['strict_gap_frames_240'] <= case['defensive_samples']
              assert max((g['frames'] for g in gaps), default=0) == case['max_pressure_gap_frames']
              assert all(g['start_tick'] < g['end_tick'] <= case['ticks']
                         and g['end_tick']-g['start_tick'] == g['frames']
                         and g['max_distance'] >= 240
                         and g['ended_by'] in (
                             'closed_to_240', 'possession_changed', 'restart', 'simulation_end'
                         ) for g in gaps)
              assert causes['uncommanded_stable_cpu'] == 0
              assert all(e['cause'] in causes and
                         0 <= e['from'] < 11 and 0 <= e['to'] < 11 and
                         e['from'] != e['to'] for e in events)
          Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print('FOOTBALL_XI_AUTOPLAY_ARTIFACT_OK cases=2')
          PY
      - name: Upload XI real-input autoplay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-xi-autoplay
          path: ${{ runner.temp }}/football-xi-autoplay.json
          retention-days: 7
          if-no-files-found: warn
