name: Football · source, visual and Web delivery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: football-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: '4.7.2'
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'
  GODOT_EDITOR_SHA256: 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
  GODOT_TEMPLATES_SHA256: 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011'

  FOOTBALL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  manager:
    name: Manager · deterministic career and save isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FOOTBALL_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install with pinned npm workspace resolver
        run: npx --yes npm@11.6.1 install --no-audit --no-fund
      - run: npm --prefix frontend test
      - name: Build manager frontend
        run: npm --prefix frontend run build
      - name: Install Chromium for real scouting UI screenshots
        run: npx playwright install --with-deps chromium
      - name: Verify and capture scouting cards in desktop and mobile
        run: node e2e/standalone.mjs
      - name: Upload scouting UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-manager-scouting-ui
          path: .artifacts/standalone/
          if-no-files-found: warn
          retention-days: 7
      - run: node tests/identity-gate.test.mjs
      - run: node --test server/career-api.test.mjs
      - run: node tests/instant-staging-dispatch.test.mjs
      - name: Exercise authority exchange and revocation in the real Workers runtime
        run: npx --yes workerd@1.20261102.1 test tests/identity-workerd.capnp
      - run: python3 scripts/check_migration.py
      - run: python3 -m unittest discover -s scripts -p 'test_migration_provenance.py'
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FOOTBALL_SOURCE_SHA }}
      - name: Verify R2 v2 run and rejected sparse shadows (HTTP CORS SHA)
        run: python3 scripts/check_football_run_v2_r2.py
      - name: Verify uploaded R2 V3 (HTTP, CORS, SHA, 12x5 layout)
        run: python3 scripts/check_football_run_v3_r2.py
      - name: Verify R2 animated idle sheets (HTTP, CORS, SHA, layout)
        run: python3 scripts/check_football_idle_r2.py
      - name: Verify R2 pass/shoot objects and staging CORS (fail closed)
        run: python3 scripts/check_football_pass_shoot_r2.py
      - name: Verify R2 carry/dribble objects and staging CORS (fail closed)
        run: python3 scripts/check_football_carry_dribble_r2.py
      # Probe the NEW canonical-style v2 candidates independently. v1 is
      # blocked by human visual review; a missing v2 is informative, not an
      # authorization to enable the old pack. Corrupt published bytes fail.
      - name: Probe pending v2 action artwork on public R2 (no activation)
        if: github.event_name == 'pull_request'
        id: action_poses_v2_probe
        run: python3 scripts/probe_football_action_poses_v2.py
      - name: Verify all eight v2 action poses on public R2 (CORS, SHA, WebP geometry)
        run: python3 scripts/check_football_action_poses_r2.py
      # Provide the exact real XI raster source for action-art review. These
      # files were already fetched and SHA-checked above; no binary assets in Git
      # and no Cloudflare credentials. PR-only, time-limited reference artifact.
      - name: Export verified XI side-run and ball-control art references
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: football-real-r2-art-reference
          path: |
            ${{ runner.temp }}/football-run-v3-r2/*.webp
            ${{ runner.temp }}/football-pass-shoot-r2/*.webp
            ${{ runner.temp }}/football-carry-dribble-r2/*.webp
          if-no-files-found: error
          retention-days: 2
      - name: Verify dedicated football R2 WebPs when public origin is configured
        id: keeper_r2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          meta = json.loads(Path('games/chess-football-godot/optional_keeper_catch_v1.json').read_text())
          assert meta['bucket'] == 'football'
          assert meta['prefix'] == 'atlases/v1/'
          assert len(meta['entries']) == 2
          base = str(meta.get('cdn_base', '')).rstrip('/')
          if meta['enabled'] is not True:
              assert base == '', 'Disabled R2 bucket should not advertise an unverified public origin'
              print('FOOTBALL_KEEPER_R2_STAGED awaiting dedicated bucket HTTPS origin; canonical fallback retained')
              Path(os.environ['GITHUB_OUTPUT']).open('a').write('enabled=false\n')
              raise SystemExit(0)
          parsed = urlsplit(base)
          assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password
          assert parsed.query == '' and parsed.fragment == ''
          assert parsed.path.endswith('/atlases/v1'), 'CDN base must point to the dedicated bucket key prefix'
          assert parsed.hostname != 'assets.chess-studio.shadowops.dpdns.org', (
              'The old shared Chess Studio CDN cannot serve dedicated football bucket objects')
          origin = 'https://staging.football.shadowops.dpdns.org'
          output = Path(os.environ['RUNNER_TEMP']) / 'football-keeper-catch-r2'
          output.mkdir(parents=True, exist_ok=True)
          expected = {
              'fc_matthias': 'fc_matthias_keeper_catch_v1.webp',
              'real_enroque': 'real_enroque_keeper_catch_v1.webp'
          }
          missing_cors = []
          for entry in meta['entries']:
              name = expected.pop(entry['team'])
              assert entry['file'] == name
              assert len(entry['sha256']) == 64
              req = Request(f'{base}/{name}', headers={
                  'Origin': origin,
                  'User-Agent': 'Football-keeper-catch-CI/1.0'
              })
              try:
                  response = urlopen(req, timeout=18)
              except HTTPError as exc:
                  raise AssertionError(
                      f'{name}: dedicated football bucket public URL returned HTTP {exc.code}'
                  ) from exc
              with response:
                  assert response.status == 200, f'{name}: HTTP {response.status}'
                  mime = response.headers.get_content_type()
                  assert mime == 'image/webp', f'{name}: content-type {mime!r}'
                  cors = response.headers.get('Access-Control-Allow-Origin', '')
                  raw = response.read(4194305)
              assert 0 < len(raw) <= 4194304, f'{name}: size outside 4 MiB cap'
              assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', f'{name}: not WebP'
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == entry['sha256'], f'{name}: mismatched SHA-256 ({digest})'
              (output / name).write_bytes(raw)
              if cors not in ('*', origin):
                  missing_cors.append(name)
              print(f'KEEPER_R2_VERIFIED team={entry["team"]} bytes={len(raw)} sha256={digest} cors={cors!r}')
          assert not expected
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as result:
              result.write('enabled=true\n')
              result.write('cors_ok=' + ('false' if missing_cors else 'true') + '\n')
          if missing_cors:
              print('FOOTBALL_KEEPER_R2_CORS_BLOCKED: CORS for staging missing in ' + ', '.join(missing_cors))
              print('Configure R2 > football > Settings > CORS Policy: allowed origin ' + origin + ', method GET')
          PY
      - name: Restore pinned Godot editor
        uses: actions/cache@v6
        with:
          path: .godot-ci/${{ env.GODOT_VERSION }}
          key: chess-football-godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
          "$godot" --version
      - run: python3 scripts/materialize_canonical.py
      - name: Verify deterministic player art
        run: python3 -S scripts/art/chess_football_sprite_forge.py verify --assets-dir games/chess-football-godot/assets/players
      - name: Verify approved canonical run atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 -S - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("games/chess-football-godot/assets/players/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          canonical = manifest["canonical_run"]
          root = manifest_path.parent
          encoded = "".join(
              (root / part).read_text(encoding="utf-8").strip()
              for part in canonical["encoded_parts"]
          )
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = canonical["sha256"]
          if digest != expected:
              raise SystemExit(f"canonical run sha mismatch: {digest} != {expected}")
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("canonical run payload is not PNG")
          print("canonical run atlas: OK", digest)
          # The approved four-direction atlas is not generated by the vector forge.
          # Its immutable encoded copy must round-trip to the reviewable PNG.
          from struct import unpack
          directional = manifest["directional_run"]
          encoded = "".join(
              (root / part).read_text(encoding="utf-8").strip()
              for part in directional["encoded_parts"]
          )
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if digest != directional["sha256"]:
              raise SystemExit("directional run hash mismatch")
          if payload != (root / "run_directions_v1/directional_run_v1.png").read_bytes():
              raise SystemExit("directional run export differs from approved PNG")
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("directional run payload is not PNG")
          width, height = unpack(">II", payload[16:24])
          expected_size = (directional["cell"]["width"] * directional["frames"],
                           directional["cell"]["height"] * len(directional["views"]))
          if (width, height) != expected_size:
              raise SystemExit(f"directional run dimensions: {(width, height)} != {expected_size}")
          if (width, height) != (1024, 576):
              raise SystemExit("directional run is not a 4x8 sheet")
          print("directional run atlas: OK", digest)
          # The approved goalkeeper has exactly four authored views; no
          # fabricated side row. Web payload and review PNG must be identical.
          goalkeeper = manifest["goalkeeper_run"]
          encoded = "".join(
              "".join((root / part).read_text(encoding="ascii").split())
              for part in goalkeeper["encoded_parts"]
          )
          payload = base64.b64decode(encoded, validate=True)
          keeper_digest = hashlib.sha256(payload).hexdigest()
          if keeper_digest != goalkeeper["sha256"]:
              raise SystemExit("keeper runtime SHA mismatch")
          if payload != (root / "keeper_canon_v1/keeper_run_v1.png").read_bytes():
              raise SystemExit("keeper Web payload differs from approved PNG")
          if not payload.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("keeper is not PNG")
          from struct import unpack
          w, h = unpack(">II", payload[16:24])
          if (w, h) != (1024, 576) or len(goalkeeper["views"]) != 4:
              raise SystemExit("keeper atlas dimensions/rows do not match")
          print("keeper run atlas: OK", keeper_digest)
          PY
      - name: Parse project
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-parse.log"
          set +e
          "$godot" --headless --path games/chess-football-godot --editor --quit 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Chess Football Godot POC contains load/parse errors.'
            exit 1
          fi
      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-smoke.log"
          set +e
          timeout 20s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/match_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Chess Football runtime smoke failed.'
            exit 1
          fi
          grep -q 'chess-football godot smoke: OK' "$log"
      - name: Future 11v11 · 22 real actors move on full-size pitch
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-eleven-actors.log"
          set +e
          timeout 50s "$godot" --headless --quit-after 900 --path games/chess-football-godot --script res://tests/eleven_actor_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::11v11 live actor/scouting/large pitch contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_ELEVEN_ACTORS_OK' "$log"
      - name: XI goal lines and woodwork use the full-size pitch
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-goal-line.log"
          set +e
          timeout 30s "$godot" --headless --quit-after 450 --path games/chess-football-godot --script res://tests/eleven_goal_line_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::11v11 goal-line and woodwork contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_GOAL_LINE_OK' "$log"
      - name: XI · real pitch-aware attack, passing, positioning and keeper
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-ai.log"
          set +e
          timeout 40s "$godot" --headless --quit-after 500 --path games/chess-football-godot --script res://tests/eleven_ai_pitch_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::11v11 attack/keeper/pitch-aware AI contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_AI_OK' "$log"
      - name: XI · measured defensive duels (unguarded vs contain)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-defense-duels.log"
          set +e
          timeout 28s "$godot" --headless --quit-after 420 --path games/chess-football-godot --script res://tests/eleven_defensive_duel_metrics.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Deterministic XI defensive duel metrics failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_DEFENSE_DUEL_METRICS_OK' "$log"
          mkdir -p .artifacts/xi-defense-duels
          python3 - "$log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          prefix = "FOOTBALL_XI_DEFENSE_DUEL_METRICS "
          rows = [json.loads(line[len(prefix):]) for line in lines if line.startswith(prefix)]
          assert len(rows) == 1, "Expected exactly one metrics record"
          result = rows[0]
          assert result["mode"] == "deterministic_scenarios_not_live_matches"
          pathlib.Path(".artifacts/xi-defense-duels/metrics.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          with pathlib.Path(sys.argv[2]).open("a") as f:
              f.write("\n### XI CPU duel decision matrix (deterministic, not match statistics)\n\n")
              f.write("| Metric | Unguarded reference | Current containment |\n|---|---:|---:|\n")
              for label, key in [
                  ("Duel decisions", "decisions"), ("Tackles started", "attempts"),
                  ("Ball recovered", "recovered"), ("Loose-ball contacts", "loose"),
                  ("Fouls", "foul"), ("Wasted tackle cooldowns", "wasted"),
                  ("Contain decisions", "contain")
              ]:
                  f.write(f'| {label} | {result["unguarded"][key]} | {result["guarded"][key]} |\n')
              f.write("\nPaired fixed-position scenarios; not a live 90-minute game or measured league outcomes.\n")
          PY
      - name: Upload XI defensive duel metrics
        uses: actions/upload-artifact@v7
        with:
          name: xi-defense-duel-metrics
          path: .artifacts/xi-defense-duels/metrics.json
          if-no-files-found: error
          retention-days: 14
      - name: XI · real touchlines, corners, goal kicks and spread
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-restarts.log"
          set +e
          timeout 35s "$godot" --headless --quit-after 450 --path games/chess-football-godot --script res://tests/eleven_restarts_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI touchlines, corners or goal kicks failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_RESTARTS_OK' "$log"
      - name: Scouting · defense and goalkeeper real-contact contract
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-defense-keeper-scouting.log"
          set +e
          timeout 24s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/defense_keeper_scouting_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Real tackle/keeper scouting contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_DEFENSE_KEEPER_SCOUTING_OK' "$log"
      - name: Scouting · real passing shooting and ball-control smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-scouting-gameplay.log"
          set +e
          timeout 24s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/scouting_gameplay_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football scouting gameplay contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_SCOUTING_GAMEPLAY_OK' "$log"
      - name: CPU difficulty · real match gameplay contract
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-cpu-difficulty.log"
          set +e
          timeout 24s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/quick_difficulty_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football CPU difficulty contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_QUICK_DIFFICULTY_OK' "$log"
      - name: Penalty shootout · isolated turn, scoring and sudden-death contract
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-penalty-shootout-rules.log"
          set +e
          timeout 20s "$godot" --headless --quit-after 180 --path games/chess-football-godot --script res://tests/penalty_shootout_rules_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football penalty shootout rules failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_PENALTY_SHOOTOUT_RULES_OK' "$log"
      - name: Contextual E · real XI dribble, standing tackle and Shift+E slide
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-contextual-e.log"
          set +e
          timeout 35s "$godot" --headless --quit-after 500 --path games/chess-football-godot --script res://tests/contextual_e_dribble_tackle_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football contextual dribble/tackle input contract failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_CONTEXTUAL_E_OK' "$log"
      - name: Playable throw-ins and corners (keyboard, touch, AI and timeout)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-playable-restarts.log"
          set +e
          timeout 25s "$godot" --headless --quit-after 400 --path games/chess-football-godot --script res://tests/playable_restarts_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::Football throw-in/corner player control regression.'
            exit 1
          fi
          grep -q 'FOOTBALL_PLAYABLE_RESTARTS_OK' "$log"
      - name: Direction-aware 3D ball roll (visual-only, no match physics changes)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-ball-directional-roll.log"
          set +e
          timeout 25s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/ball_directional_roll_smoke.gd 2>&1 | tee "$log"
