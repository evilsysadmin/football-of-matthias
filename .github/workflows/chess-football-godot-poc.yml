      - name: Capture R2 animated idle in real Godot 3D (five views, before/after)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-idle-r2-real-visual.log"
          export FOOTBALL_IDLE_R2_PREVIEW_DIR="$RUNNER_TEMP/football-idle-r2"
          timeout 75s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/animated_idle_r2_visual.gd 2>&1 | tee "$log"
          grep -q 'FOOTBALL_IDLE_R2_REAL_GODOT_REVIEW_OK actors=4 views=5 phases=2' "$log"
          for stage in BEFORE AFTER MOTION; do
            marker="FOOTBALL_IDLE_R2_CAPTURE_${stage}"
            shot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            test -n "$shot" && test -s "$shot"
            cp "$shot" "$RUNNER_TEMP/chess-football-review/idle-r2-${stage,,}.png"
          done
      - name: Capture real 11v11 pass/shoot before/after (two cameras)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-pass-shoot-r2-visual.log"
          export FOOTBALL_PASS_SHOOT_PREVIEW_DIR="$RUNNER_TEMP/football-pass-shoot-r2"
          set +e
          timeout 85s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/pass_shoot_r2_visual.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          for mode in broadcast tactical; do
            for phase in BEFORE AFTER; do
              marker="FOOTBALL_PASS_SHOOT_CAPTURE_${phase}_${mode^^}"
              shot="$(sed -n "s/^$marker=//p" "$log" | tail -1)"
              if [[ -n "$shot" && -s "$shot" ]]; then
                cp "$shot" "$RUNNER_TEMP/chess-football-review/pass-shoot-${phase,,}-$mode.png"
              fi
            done
          done
          # Record the real chronological 8-frame sequences, not just
          # selected stills. Failure to reach the last pose blocks merge.
          timeline="$(sed -n 's/^FOOTBALL_PASS_SHOOT_CAPTURE_TIMELINE_BROADCAST=//p' "$log" | tail -1)"
          if [[ -n "$timeline" && -s "$timeline" ]]; then
            cp "$timeline" "$RUNNER_TEMP/chess-football-review/pass-shoot-timeline-broadcast.png"
          fi
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::Real Godot pass/shoot visual capture failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_PASS_SHOOT_REAL_GODOT_REVIEW_OK teams=2 actions=2 phases=3 cameras=2' "$log"
          test "$(grep -c '^FOOTBALL_XI_ACTION_TIMELINE_OK team=' "$log")" -eq 4
          test -s "$RUNNER_TEMP/chess-football-review/pass-shoot-timeline-broadcast.png"
          for mode in broadcast tactical; do
            for phase in before after; do
              test -s "$RUNNER_TEMP/chess-football-review/pass-shoot-$phase-$mode.png"
            done
          done
