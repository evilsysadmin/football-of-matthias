          grep -Fq 'assets/players/keeper_canon_v1/*.b64' games/chess-football-godot/export_presets.cfg
          grep -q 'variant/thread_support=false' games/chess-football-godot/export_presets.cfg
          grep -q 'renderer/rendering_method="gl_compatibility"' games/chess-football-godot/project.godot
          grep -q '^window/size/mode=3$' games/chess-football-godot/project.godot
          grep -q '^boot_splash/show_image=false$' games/chess-football-godot/project.godot
  web_runtime:
    name: Real Chromium · Godot Web boot
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FOOTBALL_SOURCE_SHA }}
      - name: Cache pinned Godot Web exporter
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: chess-football-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v1
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
      - name: Install pinned Godot Web templates
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          if [[ ! -f "$dir/web_nothreads_release.zip" || ! -f "$dir/web_nothreads_debug.zip" ]]; then
            archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            mkdir -p "$dir" "$unpack"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$archive"
            echo "$GODOT_TEMPLATES_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$dir/web_nothreads_debug.zip"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$dir/web_nothreads_release.zip"
          fi
      - run: python3 scripts/materialize_canonical.py
      - name: Export actual Godot Web build before publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/chess-football-godot/build/web
          cd games/chess-football-godot
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --editor --quit
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install with pinned npm workspace resolver
        run: npx --yes npm@11.6.1 install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Boot real WebAssembly in Chromium
        # The Godot Web app runs from 127.0.0.1 with a random test port.
        # The bucket CORS remains restricted to the real staging origin.
        # Our local-only bridge checks live staging CORS + exact SHA-256
        # before fulfilling only the two R2 requests with verified bytes.
        env:
          FOOTBALL_CI_KEEPER_R2_BRIDGE: '1'
        run: node e2e/football-godot-real-web.mjs
      - name: Upload real Web browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chess-football-real-web
          path: .artifacts/football-web/
          if-no-files-found: warn
          retention-days: 7

      - name: Compile the independent manager and immutable staging manifests
        run: |
          python3 scripts/check_migration.py
          python3 scripts/prepare_staging.py
          npm --prefix frontend run build
          node e2e/standalone.mjs
          python3 scripts/package_staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-staging-${{ env.FOOTBALL_SOURCE_SHA }}
          path: .artifacts/football-staging/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-standalone-ui
          path: .artifacts/standalone/
          if-no-files-found: warn
  required_gate:
    name: Football · required visual gate
    if: always()
    needs: [manager, validate, web_runtime]
    runs-on: ubuntu-24.04
    steps:
      - env:
          MANAGER: ${{ needs.manager.result }}
          GODOT: ${{ needs.validate.result }}
          WEB: ${{ needs.web_runtime.result }}
        run: test "$MANAGER" = success && test "$GODOT" = success && test "$WEB" = success
