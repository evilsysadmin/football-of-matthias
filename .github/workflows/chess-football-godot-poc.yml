            echo '::error::Optional idle front R2 runtime regression.'
            exit 1
          fi
          grep -q 'football optional idle-front R2 fallback smoke: OK' "$log"
      - name: Staged R2 lateral-run parity and rollback smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-lateral-run-r2.log"
          set +e
