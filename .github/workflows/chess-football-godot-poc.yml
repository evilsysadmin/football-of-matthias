            echo '::error::Football R2 tackle v2 normalization or fallback regressed.'
            exit 1
          fi
          grep -q 'football tackle v2 R2 four-sheet staging, frames and fallback: OK' "$log"
      - name: Optional keeper catch R2 eight-frame and fallback contract
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-keeper-catch-r2-v1.log"
          set +e
          timeout 45s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/keeper_catch_r2_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
