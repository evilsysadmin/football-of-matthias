          canonical_actions="$(sed -n 's/^VISUAL_CAPTURE_CANONICAL_ACTIONS=//p' "$log" | tail -1)"
          keepers_front="$(sed -n 's/^VISUAL_CAPTURE_KEEPERS_FRONT=//p' "$log" | tail -1)"
          keepers_diagonal="$(sed -n 's/^VISUAL_CAPTURE_KEEPERS_DIAGONAL=//p' "$log" | tail -1)"
