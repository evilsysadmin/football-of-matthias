            echo '::error::Football pitch spacing smoke failed.'
            exit 1
          fi
          grep -q 'chess-football pitch spacing smoke: OK' "$log"
      - name: Keeper live-motion smoke
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/chess-football-keeper-motion-smoke.log"
          set +e
          timeout 30s "$godot" --headless --quit-after 360 --path games/chess-football-godot --script res://tests/keeper_motion_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
