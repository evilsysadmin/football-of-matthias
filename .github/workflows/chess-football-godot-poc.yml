          for mode in broadcast tactical; do
            marker="FOOTBALL_XI_V3_WIDTH_CAPTURE_${mode^^}"
            comparison="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            if [[ -n "$comparison" && -s "$comparison" ]]; then
              cp "$comparison" "$RUNNER_TEMP/chess-football-review/xi-v3-width-on-off-$mode.png"
            fi
          done
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::XI carrier/ball real Godot visual parity regressed'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_CARRIER_PARITY_VISUAL_OK teams=2 views=3 cameras=2 actual_r2=1' "$log"
          for mode in broadcast tactical; do
            marker="FOOTBALL_XI_CARRIER_PARITY_CAPTURE_${mode^^}"
            shot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            test -n "$shot" && test -s "$shot"
            cp "$shot" "$RUNNER_TEMP/chess-football-review/xi-carrier-ball-parity-$mode.png"
            grep -q "FOOTBALL_XI_V3_WIDTH_RENDER_DELTA camera=$mode changed_pixels=" "$log"
            marker="FOOTBALL_XI_V3_WIDTH_CAPTURE_${mode^^}"
            comparison="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            test -n "$comparison" && test -s "$comparison"
            cp "$comparison" "$RUNNER_TEMP/chess-football-review/xi-v3-width-on-off-$mode.png"
          done
      - name: Visual review R2 v2 before/after in actual 11v11 Godot
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-run-v2-visual.log"
          export FOOTBALL_RUN_V2_PREVIEW_DIR="$RUNNER_TEMP/football-run-v2-r2"
          set +e
          timeout 70s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/run_v2_r2_visual.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::R2 v2 real Godot visual assertion failed'
            exit 1
          fi
          grep -q 'FOOTBALL_RUN_V2_REAL_GODOT_REVIEW_OK teams=2 outfield=20 shadows=22' "$log"
          for phase in BEFORE AFTER; do
            marker="FOOTBALL_RUN_V2_CAPTURE_${phase}"
            shot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            test -n "$shot" && test -s "$shot"
            cp "$shot" "$RUNNER_TEMP/chess-football-review/run-v2-${phase,,}.png"
          done
      - name: Real Godot XI V2 versus V3 before/after (broadcast and tactical)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-run-v3-visual.log"
          export FOOTBALL_RUN_V2_PREVIEW_DIR="$RUNNER_TEMP/football-run-v2-r2"
          export FOOTBALL_RUN_V3_PREVIEW_DIR="$RUNNER_TEMP/football-run-v3-r2"
          set +e
          timeout 80s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/run_v3_r2_visual.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::V3 12-pose real Godot visual assertion failed'
            exit 1
          fi
          grep -q 'FOOTBALL_RUN_V3_REAL_GODOT_REVIEW_OK teams=2 outfield=20 shadows=22 frames=12 cameras=2' "$log"
          for mode in broadcast tactical; do
            for phase in BEFORE AFTER; do
              marker="FOOTBALL_RUN_V3_CAPTURE_${phase}_${mode^^}"
              shot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
              test -n "$shot" && test -s "$shot"
              cp "$shot" "$RUNNER_TEMP/chess-football-review/run-v3-${phase,,}-$mode.png"
            done
          done
      - name: Render verified keeper-catch R2 poses in actual Godot 3D
        if: steps.keeper_r2.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-keeper-r2-real-visual.log"
          export FOOTBALL_KEEPER_CATCH_PREVIEW_DIR="$RUNNER_TEMP/football-keeper-catch-r2"
          timeout 55s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/keeper_catch_r2_visual.gd 2>&1 | tee "$log"
          grep -q 'FOOTBALL_KEEPER_R2_REAL_GODOT_REVIEW_OK teams=2 poses=8' "$log"
          for team in FC ENROQUE; do
            for phase in OPEN CLOSING HELD BROADCAST SAVE-DIVE SAVE-CATCH-OPEN SAVE-CATCH-HELD; do
              marker="FOOTBALL_KEEPER_R2_CAPTURE_${team}_${phase}"
              screenshot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
              test -n "$screenshot" && test -s "$screenshot"
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/keeper-r2-${team,,}-${phase,,}.png"
            done
          done
      - name: Capture 4-3-3 stadium preview (actual Godot 1280x720)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-preview-visual.log"
          set +e
          timeout 60s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/eleven_stadium_preview.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # Keep failed visual evidence for inspection. Godot can log an
          # assertion yet still emit a PNG and return success.
          for mode in tactical broadcast; do
            marker="FOOTBALL_XI_PREVIEW_${mode^^}"
            screenshot="$(sed -n "s/^$marker=//p" "$log" | tail -1)"
            if [[ -n "$screenshot" && -s "$screenshot" ]]; then
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-preview-$mode.png"
            fi
          done
          # Both live XI vertical lanes use the same playable close-follow
          # zoom; archive actual 1280x720 Godot pixels for visual review.
          for lane in FAR NEAR; do
            marker="FOOTBALL_XI_LANE_CAPTURE_${lane}"
            screenshot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            if [[ -n "$screenshot" && -s "$screenshot" ]]; then
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-lane-${lane,,}.png"
            fi
          done
          # Capture the actual near-human/left-goalmouth composition
          # that exposed the cropped white touchline in live play.
          human_marker="FOOTBALL_XI_NEAR_HUMAN_CAPTURE"
          human_shot="$(sed -n "s/^$human_marker=//p" "$log" | tail -1)"
          if [[ -n "$human_shot" && -s "$human_shot" ]]; then
            cp "$human_shot" "$RUNNER_TEMP/chess-football-review/xi-near-human-live.png"
          fi
          test -s "$RUNNER_TEMP/chess-football-review/xi-near-human-live.png"
          grep -q 'FOOTBALL_XI_NEAR_TRANSIENT_OK frames=36 margin=46' "$log"
          # Real XI set-piece framing: keep the mid-band throw-in and near
          # corner screenshots even if an assertion rejects a crop.
          for case in MID_THROW NEAR_CORNER; do
            marker="FOOTBALL_XI_RESTART_CAPTURE_${case}"
            screenshot="$(sed -n "s/^${marker}=//p" "$log" | tail -1)"
            if [[ -n "$screenshot" && -s "$screenshot" ]]; then
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-restart-${case,,}.png"
            fi
          done
          # Both real XI penalty orientations: guard the actual goal, keeper,
          # aim indicator and 19 non-kicking players against arcade regression.
          for side in HUMAN CPU; do
            marker="FOOTBALL_XI_PENALTY_${side}_CAPTURE"
            screenshot="$(sed -n "s/^$marker=//p" "$log" | tail -1)"
            if [[ -n "$screenshot" && -s "$screenshot" ]]; then
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-penalty-${side,,}-1280x720.png"
            fi
          done
          # In addition to the stationary kickoff screenshots, inspect a
          # distant RUNNING pose (nonzero authored lean) for foot-ground contact.
          run_capture="$(sed -n 's/^FOOTBALL_XI_RUN_GROUND_BROADCAST=//p' "$log" | tail -1)"
          if [[ -n "$run_capture" && -s "$run_capture" ]]; then
            cp "$run_capture" "$RUNNER_TEMP/chess-football-review/xi-running-ground-broadcast.png"
          fi
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::The real 11v11 Godot screenshots contain a failed visual assertion.'
            exit 1
          fi
          test -s "$RUNNER_TEMP/chess-football-review/xi-running-ground-broadcast.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-lane-far.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-lane-near.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-restart-mid_throw.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-restart-near_corner.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-penalty-human-1280x720.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-penalty-cpu-1280x720.png"
          grep -q 'FOOTBALL_XI_PREVIEW_OK teams=11+11 stage=full_pitch unique=22' "$log"
          for mode in tactical broadcast; do
            test -s "$RUNNER_TEMP/chess-football-review/xi-preview-$mode.png"
          done
      - name: Capture XI ultrawide 1766x832 (actual Godot)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-ultrawide.log"
          # CI's fullscreen project setting overrides --windowed in Xvfb.
          # Temporarily request a real window ONLY for this render test; the
          # committed project remains fullscreen in the browser export.
          project=games/chess-football-godot/project.godot
          cp "$project" "$RUNNER_TEMP/football-ultrawide-project.godot"
          trap 'cp "$RUNNER_TEMP/football-ultrawide-project.godot" "$project"' EXIT
          sed -i 's/^window\/size\/mode=3$/window\/size\/mode=0/' "$project"
          grep -q "^window/size/mode=0$" "$project"
          set +e
          timeout 50s xvfb-run -a -s "-screen 0 2000x1200x24" "$godot" --windowed --resolution 1766x832 --path games/chess-football-godot --script res://tests/eleven_ultrawide_preview.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/football-ultrawide-project.godot" "$project"
          trap - EXIT
          screenshot="$(sed -n 's/^FOOTBALL_XI_ULTRAWIDE_CAPTURE=//p' "$log" | tail -1)"
          if [[ -n "$screenshot" && -s "$screenshot" ]]; then
            cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-ultrawide-1766x832.png"
          fi
          penalty_screenshot="$(sed -n 's/^FOOTBALL_XI_ULTRAWIDE_PENALTY_CAPTURE=//p' "$log" | tail -1)"
          if [[ -n "$penalty_screenshot" && -s "$penalty_screenshot" ]]; then
            cp "$penalty_screenshot" "$RUNNER_TEMP/chess-football-review/xi-penalty-ultrawide-1766x832.png"
          fi
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$log"; then
            echo '::error::Ultrawide Godot visual assertions failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_ULTRAWIDE_OK' "$log"
          test -s "$RUNNER_TEMP/chess-football-review/xi-ultrawide-1766x832.png"
          test -s "$RUNNER_TEMP/chess-football-review/xi-penalty-ultrawide-1766x832.png"
      - name: XI reference viewport · user 1500x788 near touchline (real Godot)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-user-1500x788.log"
          set +e
          # Godot's project defaults to fullscreen; xvfb-run's default
          # 1280x1024 virtual screen overrides --resolution. Explicitly
          # size the DISPLAY itself to the user's physical screenshot.
          FOOTBALL_XI_REFERENCE_VIEWPORT=1 timeout 50s xvfb-run -a -s "-screen 0 1500x788x24" "$godot" --windowed --resolution 1500x788 --path games/chess-football-godot --script res://tests/eleven_stadium_preview.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # Archive the screenshot even on assertion failure, then block
          # Ready/merge. Never fake an oversized image by resizing 1280p.
          marker="FOOTBALL_XI_USER_VIEWPORT_CAPTURE"
          shot="$(sed -n "s/^$marker=//p" "$log" | tail -1)"
          if [[ -n "$shot" && -s "$shot" ]]; then
            cp "$shot" "$RUNNER_TEMP/chess-football-review/xi-user-1500x788-near-line.png"
          fi
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::1500x788 XI near touchline user-reference regression.'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_USER_VIEWPORT_OK viewport=1500x788 frames=36' "$log"
          test -s "$RUNNER_TEMP/chess-football-review/xi-user-1500x788-near-line.png"
      - name: XI off-ball running frames in actual 3D Godot (two clubs)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-xi-offball-gait.log"
          set +e
          timeout 65s xvfb-run -a "$godot" --windowed --resolution 1280x720 --path games/chess-football-godot --script res://tests/xi_offball_animation_smoke.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          for phase in 0 1 2; do
            screenshot="$(sed -n "s/^FOOTBALL_XI_OFFBALL_CAPTURE_${phase}=//p" "$log" | tail -1)"
            if [[ -n "$screenshot" && -s "$screenshot" ]]; then
              cp "$screenshot" "$RUNNER_TEMP/chess-football-review/xi-offball-run-phase-${phase}.png"
            fi
          done
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|ERROR: Failed to load script|Parse Error:' "$log"; then
            echo '::error::XI off-ball run visual poses froze or did not render'
            exit 1
          fi
          grep -q 'FOOTBALL_XI_OFFBALL_SLOW_FPS_OK players=20 teams=2 views=5 fps=15 frames=12 no_skipped_poses=1' "$log"
          for phase in 0 1 2; do
            test -s "$RUNNER_TEMP/chess-football-review/xi-offball-run-phase-${phase}.png"
          done
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chess-football-visual-review
          path: ${{ runner.temp }}/chess-football-review/
          if-no-files-found: error
          retention-days: 7
      # Public bytes may be intact before the operator adds bucket CORS.
      # Still capture real Godot frames, but never pass the required gate
      # or publish a Web build until browsers can fetch both sheets.
      - name: Enforce CORS on dedicated Football R2 origin
        if: steps.keeper_r2.outputs.enabled == 'true'
        shell: bash
        run: |
          test "${{ steps.keeper_r2.outputs.cors_ok }}" = true
      - name: Export lossless R2 candidate atlas pack (no publication)
        shell: bash
        run: |
          set -euo pipefail
          godot="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot"
          log="$RUNNER_TEMP/football-atlas-webp-export.log"
          set +e
          timeout 45s "$godot" --headless --path games/chess-football-godot --script res://scripts/export_r2_atlases.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Assertion failed|Parse Error:|FOOTBALL_ATLAS_EXPORT_ERROR' "$log"; then
            echo '::error::Lossless atlas export failed.'
            exit 1
          fi
          grep -q 'FOOTBALL_ATLAS_WEBP_EXPORT_OK families=3 teams=2 sheets=6' "$log"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('games/chess-football-godot/build/r2-atlases')
          data = json.loads((root / 'atlas-manifest-v1.json').read_text())
          assert data['schema'] == 1 and len(data['assets']) == 6
          assert {x['family'] for x in data['assets']} == {'lateral_run', 'directional_run', 'goalkeeper_run'}
          assert {x['team'] for x in data['assets']} == {'fc_matthias', 'real_enroque'}
          for x in data['assets']:
              raw = (root / x['file']).read_bytes()
              assert len(raw) == x['bytes'] and raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
              assert hashlib.sha256(raw).hexdigest() == x['sha256']
          print('FOOTBALL_ATLAS_R2_PACK_MANIFEST_OK sheets=6')
          PY
      - name: Upload approved R2 candidate atlases for operator review
        uses: actions/upload-artifact@v7
        with:
          name: football-r2-atlas-candidates
          path: games/chess-football-godot/build/r2-atlases/
          if-no-files-found: error
          retention-days: 7
      - name: Web export contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'platform="Web"' games/chess-football-godot/export_presets.cfg
          grep -Fq 'assets/players/run_canon/*.b64' games/chess-football-godot/export_presets.cfg
          grep -Fq 'assets/players/run_directions_v1/*.b64' games/chess-football-godot/export_presets.cfg
          grep -Fq 'assets/players/keeper_canon_v1/*.b64' games/chess-football-godot/export_presets.cfg
          grep -Fq 'optional_run_v3.json' games/chess-football-godot/export_presets.cfg
          grep -q 'variant/thread_support=false' games/chess-football-godot/export_presets.cfg
          grep -q 'renderer/rendering_method="gl_compatibility"' games/chess-football-godot/project.godot
          grep -q '^window/size/mode=3$' games/chess-football-godot/project.godot
          grep -q '^boot_splash/show_image=false$' games/chess-football-godot/project.godot
  web_runtime:
    name: Real Chromium · Godot Web boot
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FOOTBALL_SOURCE_SHA }}
      - name: Cache pinned Godot Web exporter
        uses: actions/cache@v6
        with:
          path: |
            .godot-ci/${{ env.GODOT_VERSION }}
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_debug.zip
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_VERSION }}/web_nothreads_release.zip
          key: chess-football-godot-web-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_RELEASE }}-nothreads-v1
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION"
          godot="$tool_dir/godot"
          if [[ ! -x "$godot" ]]; then
            mkdir -p "$tool_dir"
            archive="$RUNNER_TEMP/godot-editor.zip"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$archive"
            echo "$GODOT_EDITOR_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" -d "$tool_dir"
            mv "$tool_dir/Godot_v${GODOT_RELEASE}_linux.x86_64" "$godot"
            chmod +x "$godot"
          fi
      - name: Install pinned Godot Web templates
        shell: bash
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          if [[ ! -f "$dir/web_nothreads_release.zip" || ! -f "$dir/web_nothreads_debug.zip" ]]; then
            archive="$RUNNER_TEMP/godot-templates.tpz"
            unpack="$RUNNER_TEMP/godot-templates"
            mkdir -p "$dir" "$unpack"
            curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$archive"
            echo "$GODOT_TEMPLATES_SHA256  $archive" | sha256sum -c -
            unzip -q "$archive" templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d "$unpack"
            install -m 0644 "$unpack/templates/web_nothreads_debug.zip" "$dir/web_nothreads_debug.zip"
            install -m 0644 "$unpack/templates/web_nothreads_release.zip" "$dir/web_nothreads_release.zip"
          fi
      - run: python3 scripts/materialize_canonical.py
      - name: Export actual Godot Web build before publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/chess-football-godot/build/web
          cd games/chess-football-godot
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --editor --quit
          "$GITHUB_WORKSPACE/.godot-ci/$GODOT_VERSION/godot" --headless --export-release Web build/web/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install with pinned npm workspace resolver
        run: npx --yes npm@11.6.1 install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Boot real WebAssembly in Chromium
        # The Godot Web app runs from 127.0.0.1 with a random test port.
        # The bucket CORS remains restricted to the real staging origin.
        # Our local-only bridge checks live staging CORS + exact SHA-256
        # before fulfilling only the two R2 requests with verified bytes.
        env:
          FOOTBALL_CI_KEEPER_R2_BRIDGE: '1'
        run: node e2e/football-godot-real-web.mjs
      - name: Upload real Web browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chess-football-real-web
          path: .artifacts/football-web/
          if-no-files-found: warn
          retention-days: 7

      - name: Compile the independent manager and immutable staging manifests
        run: |
          python3 scripts/check_migration.py
          python3 scripts/prepare_staging.py
          npm --prefix frontend run build
          node e2e/standalone.mjs
          python3 scripts/package_staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-staging-${{ env.FOOTBALL_SOURCE_SHA }}
          path: .artifacts/football-staging/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-standalone-ui
          path: .artifacts/standalone/
          if-no-files-found: warn
  required_gate:
    name: Football · required visual gate
    if: always()
    needs: [manager, validate, web_runtime]
    runs-on: ubuntu-24.04
    steps:
      - env:
          MANAGER: ${{ needs.manager.result }}
          GODOT: ${{ needs.validate.result }}
          WEB: ${{ needs.web_runtime.result }}
        run: test "$MANAGER" = success && test "$GODOT" = success && test "$WEB" = success

  notify_staging:
    name: Football · wake staging after green main CI
    needs: [required_gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/football-of-matthias'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request immediate trusted Infra reconciliation
        shell: bash
        env:
          # Dedicated fine-grained token: only Actions write on shadowops-infra.
          # No Cloudflare / R2 credentials may be stored in this repository.
          GH_TOKEN: ${{ secrets.SHADOWOPS_INFRA_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::SHADOWOPS_INFRA_ACTIONS_TOKEN is absent; scheduled staging reconciliation remains active."
            exit 0
          fi
          if ! gh api -X POST repos/evilsysadmin/shadowops-infra/actions/workflows/football-pages-staging.yml/dispatches -f ref=main >/dev/null; then
            echo "::warning::Immediate staging wake-up failed; scheduled reconciliation remains active."
            exit 0
          fi
          echo "FOOTBALL_STAGING_WAKEUP_REQUESTED source_sha=$GITHUB_SHA"
